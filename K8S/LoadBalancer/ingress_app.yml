apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketshappy-ingress
  namespace: happyticket
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-websocket: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-set-headers: "ingress-nginx/custom-headers"


spec:
  ingressClassName: nginx
  rules:
    - host: ticketshappy.com
      http:
        paths:
          # WebSocket/SignalR hubs - highest priority
          - path: /hubs(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5000

          - path: /hubs/notifications
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000

          # API endpoints
          - path: /api(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5000
          # Authentication endpoints
          - path: /authentication(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5000
          # Static assets
          - path: /Images(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5000
          # API documentation
          - path: /swagger(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5000
          # Frontend UI - catch-all (lowest priority)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80

  tls:
    - hosts:
        - ticketshappy.com
      secretName: happyticket-tls