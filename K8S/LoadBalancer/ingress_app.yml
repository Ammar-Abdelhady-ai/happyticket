apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: happyticket-ingress
  namespace: happyticket
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - test.ticketshappy.com
      secretName: happyticket-tls
  rules:
    - host: test.ticketshappy.com
      http:
        paths:
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 5001
