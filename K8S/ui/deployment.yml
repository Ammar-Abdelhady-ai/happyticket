apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: happyticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ui
                topologyKey: kubernetes.io/hostname


      containers:
        - name: ui
          image: CHANGE_ME_IMAGE_NAME
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
